openapi: 3.1.0
info:
  title: TaskPilot API
  version: 0.1.0-proposed
  summary: PROPOSED contract — not implemented.
  description: |
    Authoritative HTTP contract for TaskPilot. Behaviour is explained in
    docs/06-API-SPECIFICATION.md; job state rules in docs/05-JOB-LIFECYCLE.md.
    Paths under /internal/v1 are served on the private worker listener only.
  license:
    name: TBD
    identifier: UNLICENSED
servers:
  - url: http://localhost:8080
    description: Local public listener
  - url: http://localhost:8081
    description: Local internal worker listener (never public)
tags:
  - name: jobs
  - name: schedules
    description: Recurring jobs (the Celery beat replacement)
  - name: meta
  - name: health
  - name: worker
    description: Internal worker API (private network, worker token)

security:
  - apiKey: []

paths:
  /v1/jobs:
    post:
      tags: [jobs]
      operationId: submitJob
      summary: Submit a job
      description: Requires scope `jobs:write`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitJobRequest' }
      responses:
        '202':
          description: Job accepted (or idempotent replay of the original job)
          headers:
            Location: { schema: { type: string }, description: '/v1/jobs/{id}' }
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      tags: [jobs]
      operationId: listJobs
      summary: List the caller's jobs (newest first)
      description: Requires scope `jobs:read`. Items omit `payload` and `result`.
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/JobStatus' }
        - name: task_type
          in: query
          schema: { $ref: '#/components/schemas/TaskTypeName' }
        - name: queue
          in: query
          schema: { $ref: '#/components/schemas/QueueName' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Page of jobs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/jobs/{job_id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      operationId: getJob
      summary: Get one job
      description: Requires `jobs:read`. Another tenant's job returns 404, same as a missing one.
      responses:
        '200':
          description: The job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/jobs/{job_id}/attempts:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [jobs]
      operationId: listJobAttempts
      summary: List a job's attempts (oldest first)
      responses:
        '200':
          description: Attempts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 10
                    items: { $ref: '#/components/schemas/Attempt' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/jobs/{job_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a job (best-effort for running jobs)
      description: Requires `jobs:cancel`. See docs/05-JOB-LIFECYCLE.md §10.
      responses:
        '200':
          description: Job is cancelled (was queued, or already cancelled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '202':
          description: Cancel requested for a running job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: List the tenant's schedules (ordered by name)
      description: Requires `jobs:read`.
      responses:
        '200':
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/schedules/{name}:
    parameters:
      - $ref: '#/components/parameters/ScheduleName'
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: Get one schedule
      description: Requires `jobs:read`. Another tenant's schedule returns 404, same as a missing one.
      responses:
        '200':
          description: The schedule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [schedules]
      operationId: putSchedule
      summary: Create or replace a schedule
      description: |
        Requires `jobs:write`. The payload and options are validated like a job submit, so the task
        type must already be registered. Re-sending an unchanged timing keeps `next_run_at`, so
        clients can sync schedules from code on every deploy. See docs/05-JOB-LIFECYCLE.md §11.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutScheduleRequest' }
      responses:
        '200':
          description: Schedule replaced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '201':
          description: Schedule created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '422':
          description: unknown_task_type, invalid_payload, invalid_options, or invalid_schedule
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: Delete a schedule (jobs it already submitted are unaffected)
      description: Requires `jobs:write`.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/task-types:
    get:
      tags: [meta]
      operationId: listTaskTypes
      summary: List enabled task types and their payload schemas
      responses:
        '200':
          description: Task types
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TaskType' }
        '401': { $ref: '#/components/responses/Problem' }

  /v1/stats:
    get:
      tags: [meta]
      operationId: getStats
      summary: Aggregated job statistics for the caller's tenant
      description: |
        Requires `jobs:read`. `totals` are all-time counts (within retention); `throughput`,
        `latency`, `errors`, `attempts`, and task-type run times cover the requested window.
        All values come from one database snapshot.
      parameters:
        - name: window
          in: query
          schema: { type: string, enum: ['15m', '1h', '6h', '24h'], default: '1h' }
      responses:
        '200':
          description: Statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /v1/me:
    get:
      tags: [meta]
      operationId: getMe
      summary: Describe the presented API key
      responses:
        '200':
          description: Identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Problem' }

  /healthz:
    get:
      tags: [health]
      operationId: liveness
      summary: Process is alive
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, const: ok } }

  /readyz:
    get:
      tags: [health]
      operationId: readiness
      summary: Ready to serve traffic (database reachable, not shutting down)
      security: []
      responses:
        '200':
          description: Ready to serve
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /internal/v1/workers:
    post:
      tags: [worker]
      operationId: registerWorker
      summary: Announce a worker and register the task types it can run
      description: |
        Called by each worker at startup. Definitions are upserted: metadata may change freely; a
        version's schema may change only while no queued or running job uses it (else 409).
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterWorkerRequest' }
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema: { type: object, required: [registered], properties: { registered: { type: integer } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /internal/v1/claims:
    post:
      tags: [worker]
      operationId: claimJob
      summary: Lease the next job from the worker's queues
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimRequest' }
      responses:
        '200':
          description: A job was claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimResponse' }
        '204': { description: No job available }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /internal/v1/attempts/{attempt_id}/heartbeat:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [worker]
      operationId: heartbeat
      summary: Extend the lease of a running attempt
      security: [{ workerToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Lease renewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HeartbeatResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /internal/v1/attempts/{attempt_id}/complete:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [worker]
      operationId: completeAttempt
      summary: Report a successful result
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../contracts/job.schema.json#/$defs/CompleteRequest' }
      responses:
        '204': { description: Applied (or identical retry of an applied report) }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /internal/v1/attempts/{attempt_id}/fail:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [worker]
      operationId: failAttempt
      summary: Report a classified failure
      security: [{ workerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../contracts/job.schema.json#/$defs/FailRequest' }
      responses:
        '204': { description: Applied }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /internal/v1/attempts/{attempt_id}/cancelled:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      tags: [worker]
      operationId: confirmCancelled
      summary: Confirm the handler was stopped after a cancel request
      security: [{ workerToken: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '204': { description: Applied }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: 'tp_<12 char prefix>_<43 char secret>'
    workerToken:
      type: http
      scheme: bearer
      description: Shared worker token; internal listener only.

  headers:
    RequestId:
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }

  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,99}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Scoped per tenant; retained 24 h (provisional).
      schema: { type: string, minLength: 1, maxLength: 255, pattern: '^[\x21-\x7E]+$' }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    FailureReason:
      type: [string, 'null']
      enum: [permanent_error, max_attempts_exceeded, null]
    AttemptStatus:
      type: string
      enum: [running, succeeded, failed, timed_out, lease_expired, cancelled]
    TaskTypeName:
      type: string
      pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,3}$'
      maxLength: 100
    ErrorInfo:
      type: object
      required: [code, message]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        message: { type: string, maxLength: 1000 }

    SubmitJobRequest:
      type: object
      additionalProperties: false
      required: [task_type, task_version, payload]
      properties:
        task_type: { $ref: '#/components/schemas/TaskTypeName' }
        task_version: { type: integer, minimum: 1 }
        payload:
          type: object
          additionalProperties: true
          description: Validated against the task type's JSON Schema; ≤ 64 KiB serialized.
        max_attempts: { type: integer, minimum: 1, maximum: 10 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400, description: 'Up to the task type max_timeout_seconds' }
        run_at: { type: string, format: date-time }
        queue: { $ref: '#/components/schemas/QueueName' }

    Job:
      type: object
      required: [id, task_type, task_version, queue, status, cancel_requested, attempt_count,
                 max_attempts, timeout_seconds, next_attempt_at, last_error, failure_reason,
                 created_at, updated_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        task_type: { $ref: '#/components/schemas/TaskTypeName' }
        task_version: { type: integer }
        queue: { $ref: '#/components/schemas/QueueName' }
        status: { $ref: '#/components/schemas/JobStatus' }
        cancel_requested: { type: boolean }
        payload: { type: object, additionalProperties: true, description: Omitted in list responses }
        result: { type: [object, 'null'], additionalProperties: true, description: Set only when succeeded; omitted in list responses }
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer }
        timeout_seconds: { type: integer }
        next_attempt_at: { type: [string, 'null'], format: date-time }
        last_error:
          oneOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        failure_reason: { $ref: '#/components/schemas/FailureReason' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    PutScheduleRequest:
      type: object
      additionalProperties: false
      required: [task_type, task_version, payload]
      description: Exactly one of interval_seconds and cron.
      properties:
        task_type: { $ref: '#/components/schemas/TaskTypeName' }
        task_version: { type: integer, minimum: 1 }
        payload:
          type: object
          additionalProperties: true
          description: Sent unchanged with every run; validated against the task type's JSON Schema.
        queue: { $ref: '#/components/schemas/QueueName' }
        interval_seconds: { type: integer, minimum: 5, maximum: 31536000, description: 'Runs every N seconds; the first run is N seconds after creation' }
        cron: { type: string, maxLength: 100, description: '5-field cron ("0 18 * * *") or a descriptor (@hourly, @daily, @weekly, @monthly, @yearly)' }
        timezone: { type: string, default: UTC, description: 'IANA zone the cron expression is evaluated in' }
        enabled: { type: boolean, default: true }
        allow_overlap: { type: boolean, default: false, description: 'false = skip a run while the previous job is still queued or running' }
        max_attempts: { type: integer, minimum: 1, maximum: 10 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 86400 }

    Schedule:
      type: object
      required: [name, task_type, task_version, queue, payload, interval_seconds, cron, timezone, enabled,
                 allow_overlap, max_attempts, timeout_seconds, next_run_at, last_run_at, last_job_id,
                 last_error, created_at, updated_at]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9_.-]{0,99}$' }
        task_type: { $ref: '#/components/schemas/TaskTypeName' }
        task_version: { type: integer }
        queue:
          description: null = the task type's queue
          oneOf:
            - $ref: '#/components/schemas/QueueName'
            - type: 'null'
        payload: { type: object, additionalProperties: true }
        interval_seconds: { type: [integer, 'null'] }
        cron: { type: [string, 'null'] }
        timezone: { type: string }
        enabled: { type: boolean }
        allow_overlap: { type: boolean }
        max_attempts: { type: [integer, 'null'] }
        timeout_seconds: { type: [integer, 'null'] }
        next_run_at: { type: [string, 'null'], format: date-time, description: null while disabled }
        last_run_at: { type: [string, 'null'], format: date-time, description: When a job was last submitted }
        last_job_id: { type: [string, 'null'], format: uuid }
        last_error:
          description: Why the last run submitted no job (previous_run_active, unknown_task_type, invalid_payload, ...); null after a run that submitted a job
          oneOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        next_cursor: { type: [string, 'null'] }

    Attempt:
      type: object
      required: [id, attempt_no, status, started_at, finished_at, error]
      properties:
        id: { type: string, format: uuid }
        attempt_no: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        error:
          oneOf:
            - allOf:
                - $ref: '#/components/schemas/ErrorInfo'
                - type: object
                  properties: { retryable: { type: boolean } }
            - type: 'null'

    TaskType:
      type: object
      required: [task_type, task_version, queue, workers_online, title, description, payload_schema, example, default_timeout_seconds,
                 max_timeout_seconds, default_max_attempts, idempotent, side_effects, test_only]
      properties:
        task_type: { $ref: '#/components/schemas/TaskTypeName' }
        task_version: { type: integer }
        queue: { $ref: '#/components/schemas/QueueName' }
        workers_online: { type: integer, description: Online workers that can run this task type. 0 means jobs will wait. }
        title: { type: string }
        description: { type: string, description: Plain-language summary registered by the worker }
        payload_schema: { type: object, additionalProperties: true, description: JSON Schema 2020-12 }
        example: { type: [object, 'null'], additionalProperties: true, description: A valid example payload }
        default_timeout_seconds: { type: integer }
        max_timeout_seconds: { type: integer }
        default_max_attempts: { type: integer }
        idempotent: { type: boolean, description: Safe to run more than once }
        side_effects: { type: boolean, description: Touches anything outside the worker process }
        test_only: { type: boolean, description: Only enabled when TASKPILOT_ENABLE_TEST_TASKS=true }

    NullableMs: { type: [number, 'null'], description: Milliseconds; null when there is no data }
    Stats:
      type: object
      required: [generated_at, window, bucket_seconds, totals, success_rate, queue_lag_ms, last_minute, latency, throughput, task_types, errors, attempts, queues]
      properties:
        generated_at: { type: string, format: date-time }
        window: { type: string, enum: ['15m', '1h', '6h', '24h'] }
        bucket_seconds: { type: integer }
        totals:
          type: object
          required: [submitted, delayed, retry_waiting, ready, running, succeeded, failed, cancelled, retries, jobs_retried, active_workers]
          properties:
            submitted: { type: integer }
            delayed: { type: integer, description: Queued with available_at in the future (run_at or retry backoff) }
            retry_waiting: { type: integer, description: Part of delayed that waits for a retry }
            ready: { type: integer, description: Queued and claimable now }
            running: { type: integer }
            succeeded: { type: integer }
            failed: { type: integer, description: Dead letter }
            cancelled: { type: integer }
            retries: { type: integer, description: Retry attempts started }
            jobs_retried: { type: integer }
            active_workers: { type: integer, description: Distinct workers running this tenant's jobs now }
        success_rate: { type: [number, 'null'], description: 'succeeded / (succeeded + failed); null when both are 0' }
        queue_lag_ms: { $ref: '#/components/schemas/NullableMs', description: How long the oldest ready job has been claimable }
        last_minute:
          type: object
          description: Jobs submitted and finished in the 60 seconds before generated_at
          required: [submitted, finished]
          properties:
            submitted: { type: integer }
            finished: { type: integer }
        latency:
          type: object
          required: [time_to_start_p50_ms, time_to_start_p95_ms, run_time_p50_ms, run_time_p95_ms, time_to_complete_p50_ms, time_to_complete_p95_ms]
          properties:
            time_to_start_p50_ms: { $ref: '#/components/schemas/NullableMs' }
            time_to_start_p95_ms: { $ref: '#/components/schemas/NullableMs' }
            run_time_p50_ms: { $ref: '#/components/schemas/NullableMs' }
            run_time_p95_ms: { $ref: '#/components/schemas/NullableMs' }
            time_to_complete_p50_ms: { $ref: '#/components/schemas/NullableMs' }
            time_to_complete_p95_ms: { $ref: '#/components/schemas/NullableMs' }
        throughput:
          type: array
          items:
            type: object
            required: [start, submitted, succeeded, failed, cancelled, retried]
            properties:
              start: { type: string, format: date-time }
              submitted: { type: integer }
              succeeded: { type: integer }
              failed: { type: integer }
              cancelled: { type: integer }
              retried: { type: integer }
        task_types:
          type: array
          items:
            type: object
            required: [task_type, total, queued, running, succeeded, failed, cancelled, retries, run_time_p50_ms, run_time_p95_ms]
            properties:
              task_type: { $ref: '#/components/schemas/TaskTypeName' }
              total: { type: integer }
              queued: { type: integer }
              running: { type: integer }
              succeeded: { type: integer }
              failed: { type: integer }
              cancelled: { type: integer }
              retries: { type: integer }
              run_time_p50_ms: { $ref: '#/components/schemas/NullableMs' }
              run_time_p95_ms: { $ref: '#/components/schemas/NullableMs' }
        errors:
          type: array
          maxItems: 10
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer }
        attempts:
          type: object
          description: Attempt outcomes finished in the window, keyed by AttemptStatus
          additionalProperties: { type: integer }
        queues:
          type: array
          description: Every known queue with this tenant's waiting/running jobs and the workers serving it
          items:
            type: object
            required: [queue, ready, delayed, running, lag_ms, workers_online, slots, task_types]
            properties:
              queue: { $ref: '#/components/schemas/QueueName' }
              ready: { type: integer }
              delayed: { type: integer }
              running: { type: integer }
              lag_ms: { $ref: '#/components/schemas/NullableMs' }
              workers_online: { type: integer }
              slots: { type: integer, description: Total concurrency of online workers serving the queue }
              task_types: { type: integer, description: Registered task types routed to the queue }

    Me:
      type: object
      required: [tenant_id, tenant_name, key_id, key_name, scopes]
      properties:
        tenant_id: { type: string, format: uuid }
        tenant_name: { type: string }
        key_id: { type: string, format: uuid }
        key_name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: ['jobs:read', 'jobs:write', 'jobs:cancel'] }

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, failing] }
          examples: [{ database: ok, schema_version: ok, shutting_down: ok }]

    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: JSON Pointer }
              message: { type: string }

    QueueName:
      type: string
      pattern: '^[a-z][a-z0-9_.-]{0,62}$'
      description: Like Celery queues. Workers subscribe to queues; task types route to one by default.

    TaskTypeDefinition:
      type: object
      description: What a worker registers for one task type version (ADR-0009)
      required: [task_type, task_version, queue, title, description, payload_schema, default_timeout_seconds,
                 max_timeout_seconds, default_max_attempts, idempotent, side_effects]
      properties:
        task_type: { $ref: '#/components/schemas/TaskTypeName' }
        task_version: { type: integer, minimum: 1 }
        queue: { $ref: '#/components/schemas/QueueName' }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        payload_schema: { type: object, additionalProperties: true, description: 'JSON Schema 2020-12 with "type": "object", <= 64 KiB' }
        example: { type: [object, 'null'], additionalProperties: true, description: Must validate against payload_schema }
        default_timeout_seconds: { type: integer, minimum: 1, maximum: 86400 }
        max_timeout_seconds: { type: integer, minimum: 1, maximum: 86400 }
        default_max_attempts: { type: integer, minimum: 1, maximum: 10 }
        idempotent: { type: boolean }
        side_effects: { type: boolean, description: 'With idempotent: false, default_max_attempts must be 1' }
        test_only: { type: boolean, default: false }

    RegisterWorkerRequest:
      type: object
      additionalProperties: false
      required: [worker_id, hostname, version, concurrency, queues, task_types]
      properties:
        worker_id: { type: string, minLength: 1, maxLength: 128 }
        hostname: { type: string, maxLength: 255 }
        version: { type: string, maxLength: 64 }
        concurrency: { type: integer, minimum: 1, maximum: 1024 }
        queues: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/QueueName' } }
        task_types: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/TaskTypeDefinition' } }

    ClaimRequest:
      type: object
      additionalProperties: false
      required: [worker_id, queues, supported]
      properties:
        worker_id: { type: string, minLength: 1, maxLength: 128 }
        queues:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/QueueName' }
        supported:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [task_type, task_version]
            properties:
              task_type: { $ref: '#/components/schemas/TaskTypeName' }
              task_version: { type: integer, minimum: 1 }

    ClaimResponse:
      type: object
      required: [lease_seconds, heartbeat_interval_seconds, job]
      properties:
        lease_seconds: { type: integer, minimum: 1 }
        heartbeat_interval_seconds: { type: integer, minimum: 1 }
        job: { $ref: '../contracts/job.schema.json' }

    HeartbeatResponse:
      type: object
      required: [lease_seconds, cancel_requested]
      properties:
        lease_seconds: { type: integer }
        cancel_requested: { type: boolean }
